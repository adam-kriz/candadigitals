<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C&amp;A Digitals – logo</title>
<style>
  body { margin: 0; padding: 32px 16px; font-family: system-ui, sans-serif; background: #ddd; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; max-width: 960px; margin: 0 auto 16px; }
  .card { flex: 1 1 300px; padding: 32px 24px; border-radius: 12px; display: grid; gap: 20px; }
  .dark { background: #262624; color: #F5F4EE; }
  .light { background: #F5F4EE; color: #262624; }
  img { display: block; max-width: 100%; }
  small { opacity: .7; }
</style>
</head>
<body>
  <div class="row">
    <div class="card dark">
      <img src="logo-on-dark.svg" alt="C&amp;A Digitals" width="380">
      <img src="mark-on-dark.svg" alt="" width="48">
      <small>tmavá</small>
    </div>
    <div class="card light">
      <img src="logo-on-light.svg" alt="C&amp;A Digitals" width="380">
      <img src="mark-on-light.svg" alt="" width="48">
      <small>světlá</small>
    </div>
  </div>
  <div class="row">
    <div class="card" style="background:#fff; grid-auto-flow: column; justify-content: start; align-items: center;">
      <img src="icon-dark.svg" alt="" width="64">
      <img src="icon-light.svg" alt="" width="64">
      <small>ikony (záložka, profilovka)</small>
    </div>
  </div>
</body>
</html>
